services:
  - type: web
    name: voiceflow-eval-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: voiceflow-db, property: connectionString}
      - key: VOICEFLOW_API_KEYS
        sync: false
      - key: APP_ENV
        value: production
databases:
  - name: voiceflow-db
    plan: free
